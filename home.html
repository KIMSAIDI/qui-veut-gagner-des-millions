<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Qui veut gagner des millions ?</title>
  <link rel="stylesheet" href="style.css">
  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // ⚠️ REMPLACE CES VALEURS par celles de ton projet Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDhBAzzDS78qqqxtE9kcqcqVdqYBFkYkHM",
      authDomain: "qui-veut-gagner-des-mill-54a74.firebaseapp.com",
      projectId: "qui-veut-gagner-des-mill-54a74",
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);
    window._db = db;

    async function loadSessions() {
      const grid = document.getElementById("sessions-grid");
      const emptyMsg = document.getElementById("empty-msg");
      try {
        const snap = await getDocs(collection(db, "sessions"));
        const sessions = [];
        snap.forEach(doc => sessions.push({ id: doc.id, ...doc.data() }));

        if (sessions.length === 0) {
          emptyMsg.style.display = "block";
          return;
        }

        sessions.forEach(s => {
          const card = document.createElement("div");
          card.className = "session-card";
          const icons = ["🌊","🎓","🌍","🎬","🔬","🎵","⚽","🍔","🏛️","🚀"];
          const icon  = s.icon || icons[Math.floor(Math.random() * icons.length)];
          const count = s.questions ? s.questions.length : 0;
          card.innerHTML = `
            <div class="session-icon">${icon}</div>
            <div class="session-name">${s.name}</div>
            <div class="session-count">${count} question${count > 1 ? "s" : ""}</div>
            <button class="session-play-btn" onclick="playSession('${s.id}', '${s.name}')">▶ JOUER</button>
          `;
          grid.appendChild(card);
        });
      } catch(e) {
        emptyMsg.textContent = "⚠️ Erreur de connexion. Vérifie ta configuration Firebase.";
        emptyMsg.style.display = "block";
        console.error(e);
      }
    }

    window.playSession = function(id, name) {
      sessionStorage.setItem("activeSessionId",   id);
      sessionStorage.setItem("activeSessionName", name);
      window.location.href = "index.html";
    };

    loadSessions();
  </script>
  <style>
    .home-container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 24px 60px;
      text-align: center;
    }

    .subtitle {
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px;
      color: rgba(255,255,255,0.4);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 48px;
    }

    /* ---- SESSION GRID ---- */
    .sessions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 18px;
      margin-bottom: 48px;
    }

    .session-card {
      background: linear-gradient(160deg, #0c1e5a 0%, #060f30 100%);
      border: 1px solid rgba(255,208,0,0.25);
      border-radius: 12px;
      padding: 28px 18px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      position: relative;
      overflow: hidden;
    }

    .session-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,208,0,0.6), transparent);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .session-card:hover {
      border-color: rgba(255,208,0,0.6);
      transform: translateY(-4px);
      box-shadow: 0 12px 36px rgba(255,208,0,0.15);
    }
    .session-card:hover::before { opacity: 1; }

    .session-icon {
      font-size: 42px;
      line-height: 1;
    }

    .session-name {
      font-family: 'Cinzel', serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 1px;
      text-align: center;
    }

    .session-count {
      font-family: 'Rajdhani', sans-serif;
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.5px;
    }

    .session-play-btn {
      margin-top: 8px;
      padding: 9px 24px;
      border-radius: 30px;
      border: none;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
      color: #080808;
      font-family: 'Cinzel', serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(255,208,0,0.3);
    }
    .session-play-btn:hover {
      box-shadow: 0 6px 22px rgba(255,208,0,0.5);
      transform: translateY(-1px);
    }

    /* ---- EMPTY STATE ---- */
    #empty-msg {
      display: none;
      font-family: 'Rajdhani', sans-serif;
      font-size: 16px;
      color: rgba(255,255,255,0.4);
      padding: 60px 20px;
      text-align: center;
    }

    /* ---- ADMIN LINK ---- */
    .admin-bar {
      border-top: 1px solid rgba(255,208,0,0.1);
      padding-top: 28px;
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .admin-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 22px;
      border-radius: 30px;
      border: 1px solid rgba(255,208,0,0.3);
      background: rgba(255,208,0,0.06);
      color: rgba(255,208,0,0.7);
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .admin-link:hover {
      background: rgba(255,208,0,0.12);
      border-color: var(--gold);
      color: var(--gold);
    }

    /* ---- LOADING ---- */
    .loading-dots {
      display: inline-flex;
      gap: 6px;
      margin-top: 40px;
    }
    .loading-dots span {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,208,0,0.4);
      animation: dotPulse 1.2s infinite ease-in-out;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotPulse {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
      40%            { transform: scale(1);   opacity: 1; }
    }
  </style>
</head>
<body>

<div class="home-container">
  <h1 class="logo" style="font-size: clamp(18px, 3.5vw, 32px); margin-bottom: 10px;">QUI VEUT GAGNER DES MILLIONS ?</h1>
  <p class="subtitle">Choisis une session de questions</p>

  <div class="sessions-grid" id="sessions-grid">
    <!-- chargement -->
    <div style="grid-column:1/-1; display:flex; flex-direction:column; align-items:center; padding:40px 0;">
      
      
    </div>
  </div>

  <p id="empty-msg">Aucune session disponible.<br>Crée-en une ici ↓</p>

  <div class="admin-bar">
    <a href="questions.html" class="admin-link">Gérer les sessions</a>
  </div>
</div>

</body>
</html>
