<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Qui veut gagner des millions ?</title>
<link rel="stylesheet" href="style.css">
<style>
/* ---- MONEY + GAUGE ROW ---- */
.money-gauge-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin: 22px 0 6px;
  flex-wrap: wrap;
}
.money {
  font-family: 'Cinzel', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--gold);
  text-shadow: 0 0 16px rgba(255,208,0,0.6);
  white-space: nowrap;
}
/* ---- GAUGE (inline, beside money) ---- */
.gauge-container {
  flex: 1;
  min-width: 180px;
  max-width: 340px;
}
.gauge-labels {
  display: flex;
  justify-content: space-between;
  margin-bottom: 5px;
}
.gauge-label-left { font-family:'Cinzel',serif; font-size:9px; color:rgba(255,255,255,0.35); letter-spacing:0.5px; }
.gauge-label-right { font-family:'Cinzel',serif; font-size:9px; color:rgba(255,208,0,0.6); letter-spacing:0.5px; }
.gauge-track {
  position: relative;
  width: 100%;
  height: 7px;
  background: rgba(255,255,255,0.07);
  border-radius: 4px;
  overflow: hidden;
}
.gauge-fill {
  height: 100%;
  border-radius: 4px;
  background: linear-gradient(90deg, #1a6b2a, #4caf50, #ffd000);
  transition: width 0.6s ease;
}
.gauge-marker {
  position: absolute;
  top: 0;
  width: 2px;
  height: 100%;
  background: rgba(0,230,118,0.7);
}
.gauge-steps {
  display: flex;
  justify-content: space-between;
  margin-top: 5px;
}
.gauge-step {
  font-family: 'Cinzel', serif;
  font-size: 8px;
  color: rgba(255,255,255,0.25);
  text-align: center;
  flex: 1;
  transition: color 0.3s;
}
.gauge-step.reached    { color: rgba(255,208,0,0.65); }
.gauge-step.guaranteed { color: rgba(0,230,118,0.85); font-weight:700; }
.gauge-step.current    { color: #ffd000; text-shadow: 0 0 7px rgba(255,208,0,0.7); }
/* ---- GUARANTEED BADGE ---- */
.guaranteed-badge {
  display: inline-block;
  background: rgba(0,230,118,0.15);
  border: 1px solid rgba(0,230,118,0.4);
  border-radius: 20px;
  padding: 2px 10px;
  font-size: 10px;
  font-family: 'Cinzel', serif;
  color: #00e676;
  margin-left: 8px;
  vertical-align: middle;
  white-space: nowrap;
}
/* ---- PAUSE OVERLAY ---- */
.pause-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(2,8,24,0.88);
  z-index: 100;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
}
.pause-overlay.active { display: flex; }
.pause-overlay h2 {
  font-family: 'Cinzel', serif;
  color: var(--gold);
  font-size: 28px;
  letter-spacing: 3px;
  text-shadow: 0 0 20px rgba(255,208,0,0.5);
}
.pause-joker-msg {
  font-family: 'Rajdhani', sans-serif;
  font-size: 17px;
  color: rgba(255,255,255,0.75);
  letter-spacing: 0.5px;
  max-width: 420px;
  text-align: center;
  line-height: 1.5;
}
.resume-btn {
  margin-top: 8px;
  padding: 12px 36px;
  border-radius: 40px;
  border: 1px solid var(--gold);
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
  color: #080808;
  font-family: 'Cinzel', serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 2px;
  cursor: pointer;
  transition: all 0.2s;
}
.resume-btn:hover { box-shadow: 0 0 28px rgba(255,208,0,0.5); transform: translateY(-2px); }
</style>
</head>
<body>

<!-- PAUSE OVERLAY -->
<div class="pause-overlay" id="pause-overlay">
  <h2>⏸ PAUSE</h2>
  <div class="pause-joker-msg" id="pause-joker-msg"></div>
  <button class="resume-btn" onclick="resumeGame()">REPRENDRE</button>
</div>

<div class="game-container">

  <button onclick="newGame()" class="newgame-btn">Nouvelle partie</button>

  <!-- ÉCRAN DE DÉMARRAGE -->
  <div id="start-screen" class="start-screen active">
    <h1 class="logo">QUI VEUT GAGNER DES MILLIONS ?</h1>
    <button onclick="startGame()" class="start-btn">🎬 LANCER LA PARTIE</button>
  </div>

  <!-- JEU (MASQUÉ AU DÉMARRAGE) -->
  <div id="game-content" style="display: none;">
    <h1 class="logo">QUI VEUT GAGNER DES MILLIONS ?</h1>

  <!-- TIMER -->
  <div class="timer-container">
    <svg class="timer-ring" viewBox="0 0 120 120">
      <circle class="timer-ring__bg" cx="60" cy="60" r="50"/>
      <circle id="timer-circle" class="timer-ring__fill" cx="60" cy="60" r="50"/>
    </svg>
    <span id="timer-display" class="timer-display">60</span>
  </div>

  <div class="question-box">
    <p id="question"></p>
  </div>

  <div id="answers" class="answers-grid"></div>

  <!-- MONEY + GAUGE CÔTE À CÔTE -->
  <div class="money-gauge-row">
    <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
      <div id="money" class="money">💰 0 €</div>
      <button id="reset" class="reset-btn">Réinitialiser</button>
    </div>
    <div class="gauge-container">
      <div class="gauge-labels">
        <span class="gauge-label-left">0 €</span>
        <span class="gauge-label-right">1 000 000 €</span>
      </div>
      <div class="gauge-track" id="gauge-track">
        <div class="gauge-fill" id="gauge-fill" style="width:0%"></div>
      </div>
      <div class="gauge-steps" id="gauge-steps"></div>
    </div>
  </div>

  <button id="validate" class="validate-btn">VALIDER</button>

  <div class="lifelines">
    <button id="fifty"    class="lifeline-btn">50/50</button>
    <button id="audience" class="lifeline-btn">Public</button>
    <button id="friend"   class="lifeline-btn">Ami</button>
  </div>
  </div>

</div>

<script>
const TIMER_DURATION  = 60;
const CIRCUMFERENCE   = 2 * Math.PI * 50;
const moneyLevels     = [0,100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000];
const GUARANTEED_LEVELS = [4, 10]; // 500€ et 32 000€

const questionEl    = document.getElementById("question");
const answersEl     = document.getElementById("answers");
const moneyEl       = document.getElementById("money");
const validateBtn   = document.getElementById("validate");
const timerDisplay  = document.getElementById("timer-display");
const timerCircle   = document.getElementById("timer-circle");

timerCircle.style.strokeDasharray  = CIRCUMFERENCE;
timerCircle.style.strokeDashoffset = 0;

let currentLevel         = Number(localStorage.getItem("currentLevel")) || 0;
let currentQuestionIndex = Number(localStorage.getItem("currentQuestionIndex")) || 0;
const questions          = JSON.parse(localStorage.getItem("quizQuestions")) || [];

const fiftyBtn    = document.getElementById("fifty");
const audienceBtn = document.getElementById("audience");
const friendBtn   = document.getElementById("friend");

if (localStorage.getItem("usedFifty")    === "true") fiftyBtn.disabled    = true;
if (localStorage.getItem("usedAudience") === "true") audienceBtn.disabled = true;
if (localStorage.getItem("usedFriend")   === "true") friendBtn.disabled   = true;

if (questions.length === 0 || !questions[currentQuestionIndex]) {
  document.body.innerHTML = "<h2 style='color:white;text-align:center;margin-top:50px;'>Aucune question enregistrée.<br><a href='questions.html' style='color:#ffb703'>Ajouter des questions</a></h2>";
}

let data = questions[currentQuestionIndex];

// ===================== GAUGE =====================
function getGuaranteedFloor(level) {
  let floor = 0;
  for (let g of GUARANTEED_LEVELS) { if (level >= g) floor = g; }
  return floor;
}

function buildGauge() {
  const track = document.getElementById("gauge-track");
  GUARANTEED_LEVELS.forEach(g => {
    const pct = (g / (moneyLevels.length - 1)) * 100;
    const m = document.createElement("div");
    m.className = "gauge-marker";
    m.style.left = pct + "%";
    track.appendChild(m);
  });
  const displayIndexes = [0, 4, 5, 7, 10, 11, 13, 15];
  const stepsEl = document.getElementById("gauge-steps");
  stepsEl.innerHTML = "";
  displayIndexes.forEach(i => {
    const div = document.createElement("div");
    div.className = "gauge-step" + (GUARANTEED_LEVELS.includes(i) ? " guaranteed" : "");
    div.id = `gs-${i}`;
    const v = moneyLevels[i];
    div.textContent = v >= 1000000 ? "1M€" : v >= 1000 ? (v/1000)+"k" : v+"€";
    stepsEl.appendChild(div);
  });
  updateGauge();
}

function updateGauge() {
  // Barre : width proportionnelle à currentLevel
  const pct = (currentLevel / (moneyLevels.length - 1)) * 100;
  document.getElementById("gauge-fill").style.width = pct + "%";

  // Étiquettes des paliers
  const displayIndexes = [0, 4, 5, 7, 10, 11, 13, 15];
  displayIndexes.forEach(i => {
    const el = document.getElementById(`gs-${i}`);
    if (!el) return;
    el.classList.remove("reached", "current");
    if (i === currentLevel)    el.classList.add("current");
    else if (i < currentLevel) el.classList.add("reached");
  });

  // Montant affiché
  moneyEl.textContent = "💰 " + moneyLevels[currentLevel].toLocaleString("fr-FR") + " €";

  // Badge palier garanti
  const floorLevel = getGuaranteedFloor(currentLevel);
  let badge = document.getElementById("guaranteed-badge");
  if (floorLevel > 0) {
    if (!badge) {
      badge = document.createElement("span");
      badge.id = "guaranteed-badge";
      badge.className = "guaranteed-badge";
      moneyEl.insertAdjacentElement("afterend", badge);
    }
    badge.textContent = "🔒 " + moneyLevels[floorLevel].toLocaleString("fr-FR") + " € assurés";
  } else {
    if (badge) badge.remove();
  }
}

buildGauge();
updateGauge();

// ===================== RÉPONSES =====================
let selected = [];
const buttons = [];
questionEl.innerText = data.question;

data.answers.forEach((answer, index) => {
  const btn = document.createElement("button");
  btn.className = "answer-btn";
  const letters = ["A","B","C","D"];
  btn.innerHTML = `<span class="answer-letter">${letters[index]}</span><span class="answer-text">${answer}</span>`;
  btn.onclick = () => {
    btn.classList.toggle("selected");
    if (selected.includes(index)) selected.splice(selected.indexOf(index), 1);
    else selected.push(index);
  };
  answersEl.appendChild(btn);
  buttons.push(btn);
});

// ===================== TIMER =====================
let timeLeft      = TIMER_DURATION;
let timerInterval = null;
let timerExpired  = false;
let isPaused      = false;

function updateTimerUI() {
  timerDisplay.textContent = timeLeft;
  const progress = timeLeft / TIMER_DURATION;
  timerCircle.style.strokeDashoffset = CIRCUMFERENCE * (1 - progress);
  if (timeLeft <= 15) {
    timerCircle.style.stroke = "#e74c3c";
    timerDisplay.style.color = "#e74c3c";
    timerCircle.classList.add("pulse");
  } else if (timeLeft <= 30) {
    timerCircle.style.stroke = "#ff8c00";
    timerDisplay.style.color = "#ff8c00";
    timerCircle.classList.remove("pulse");
  } else {
    timerCircle.style.stroke = "#ffb703";
    timerDisplay.style.color = "#ffb703";
    timerCircle.classList.remove("pulse");
  }
}

function pauseGame(msg) {
  if (timerExpired || isPaused) return;
  isPaused = true;
  clearInterval(timerInterval);
  timerInterval = null;
  document.getElementById("pause-joker-msg").textContent = msg || "";
  document.getElementById("pause-overlay").classList.add("active");
}

function resumeGame() {
  if (!isPaused) return;
  isPaused = false;
  document.getElementById("pause-overlay").classList.remove("active");
  startTimer();
}

function startTimer() {
  updateTimerUI();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerUI();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      timerExpired = true;
      buttons.forEach(btn => btn.disabled = true);
      validateBtn.disabled = true;
      buttons.forEach((btn, i) => { if (data.correct.includes(i)) btn.classList.add("correct"); });
      const floorLevel = getGuaranteedFloor(currentLevel);
      currentLevel = Math.max(floorLevel, currentLevel - 1);
      updateGauge();
      localStorage.setItem("currentLevel", currentLevel);
      alert("⏰ Temps écoulé ! Palier atteint : " + moneyLevels[currentLevel].toLocaleString("fr-FR") + " €");
      setTimeout(() => {
        currentQuestionIndex++;
        localStorage.setItem("currentQuestionIndex", currentQuestionIndex);
        if (currentQuestionIndex >= questions.length) { alert("Partie terminée ! Score final : " + moneyLevels[currentLevel].toLocaleString("fr-FR") + " €"); newGame(); return; }
        location.reload();
      }, 1500);
    }
  }, 1000);
}

// Fonction pour démarrer le jeu
function startGame() {
  document.getElementById("start-screen").classList.remove("active");
  document.getElementById("game-content").style.display = "block";
  startTimer();
}

// ===================== VALIDATION =====================
validateBtn.onclick = () => {
  if (timerExpired || isPaused) return;
  clearInterval(timerInterval);
  timerInterval = null;

  const correctClicked =
    selected.every(i => data.correct.includes(i)) &&
    data.correct.length === selected.length;

  buttons.forEach((btn, i) => {
    if (data.correct.includes(i)) btn.classList.add("correct");
    else if (selected.includes(i)) btn.classList.add("wrong");
    btn.disabled = true;
  });
  validateBtn.disabled = true;

  if (correctClicked) {
    currentLevel++;
    if (currentLevel >= moneyLevels.length) currentLevel = moneyLevels.length - 1;
    updateGauge();
    alert("✅ Correct ! Vous gagnez : " + moneyLevels[currentLevel].toLocaleString("fr-FR") + " €");
  } else {
    const floorLevel = getGuaranteedFloor(currentLevel);
    currentLevel = Math.max(floorLevel, currentLevel - 1);
    updateGauge();
    alert("❌ Mauvaise réponse ! Palier atteint : " + moneyLevels[currentLevel].toLocaleString("fr-FR") + " €");
  }

  localStorage.setItem("currentLevel", currentLevel);
  setTimeout(() => {
    currentQuestionIndex++;
    localStorage.setItem("currentQuestionIndex", currentQuestionIndex);
    if (currentQuestionIndex >= questions.length) { alert("Partie terminée ! Score final : " + moneyLevels[currentLevel].toLocaleString("fr-FR") + " €"); newGame(); return; }
    location.reload();
  }, 1500);
};

// ===================== JOKERS =====================
fiftyBtn.onclick = () => {
  const wrongIndexes = buttons.map((b,i) => i).filter(i => !data.correct.includes(i));
  wrongIndexes.sort(() => Math.random() - 0.5);
  wrongIndexes.slice(0, 2).forEach(i => buttons[i].style.visibility = "hidden");
  fiftyBtn.disabled = true;
  localStorage.setItem("usedFifty", "true");
  pauseGame("Deux mauvaises réponses ont été éliminées.");
};

audienceBtn.onclick = () => {
  audienceBtn.disabled = true;
  localStorage.setItem("usedAudience", "true");
  pauseGame();
};

friendBtn.onclick = () => {
  friendBtn.disabled = true;
  localStorage.setItem("usedFriend", "true");
  pauseGame();
};

// ===================== RESET / NEW GAME =====================
document.getElementById("reset").onclick = () => {
  if (confirm("Voulez-vous vraiment remettre le gain à zéro ?")) {
    currentLevel = 0;
    localStorage.setItem("currentLevel", currentLevel);
    updateGauge();
  }
};

function newGame() {
  localStorage.removeItem("currentQuestionIndex");
  localStorage.removeItem("currentLevel");
  localStorage.removeItem("usedFifty");
  localStorage.removeItem("usedAudience");
  localStorage.removeItem("usedFriend");
  location.reload();
}
</script>

</body>
</html>
