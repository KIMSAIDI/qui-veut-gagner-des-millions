<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Créer une question</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-container">
  <h1 class="logo">CRÉER UNE QUESTION</h1>

  <textarea id="question" placeholder="Écris la question ici..."></textarea>

  <div class="answer-line">
    <input type="checkbox" id="c1">
    <input type="text" id="r1" placeholder="Réponse A">
  </div>

  <div class="answer-line">
    <input type="checkbox" id="c2">
    <input type="text" id="r2" placeholder="Réponse B">
  </div>

  <div class="answer-line">
    <input type="checkbox" id="c3">
    <input type="text" id="r3" placeholder="Réponse C">
  </div>

  <div class="answer-line">
    <input type="checkbox" id="c4">
    <input type="text" id="r4" placeholder="Réponse D">
  </div>

  <p class="info">Coche la/les bonne(s) réponse(s)</p>

  <button class="validate-btn" onclick="saveQuestion()">ENREGISTRER</button>

  <hr>

  <h2>Questions enregistrées</h2>
  <ul id="questions-list"></ul>
</div>

<script>
function saveQuestion() {
  let questions = JSON.parse(localStorage.getItem("quizQuestions")) || [];

  if (questions.length >= 20) {
    alert("❌ Tu as déjà 20 questions enregistrées");
    return;
  }

  const answers = [r1.value, r2.value, r3.value, r4.value];
  const correct = [];
  if (c1.checked) correct.push(0);
  if (c2.checked) correct.push(1);
  if (c3.checked) correct.push(2);
  if (c4.checked) correct.push(3);

  if (!question.value || answers.some(a => a === "") || correct.length === 0) {
    alert("⚠️ Remplis tout et coche au moins une bonne réponse");
    return;
  }

  questions.push({ question: question.value, answers, correct });
  localStorage.setItem("quizQuestions", JSON.stringify(questions));

  alert(`✅ Question ajoutée (${questions.length}/20)`);

  question.value = "";
  [r1,r2,r3,r4].forEach(i => i.value = "");
  [c1,c2,c3,c4].forEach(c => c.checked = false);

  renderQuestions();
}

function renderQuestions() {
  const questions = JSON.parse(localStorage.getItem("quizQuestions")) || [];
  const list = document.getElementById("questions-list");
  list.innerHTML = "";

  questions.forEach((q, index) => {
    const letters = ["A", "B", "C", "D"];
    const answersHTML = q.answers.map((a, i) => {
      const isCorrect = q.correct.includes(i);
      return `<span style="
        display: inline-block;
        margin: 4px 6px 0 0;
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 13px;
        border: 1px solid ${isCorrect ? 'rgba(0,230,118,0.5)' : 'rgba(255,255,255,0.1)'};
        background: ${isCorrect ? 'rgba(0,230,118,0.12)' : 'rgba(255,255,255,0.04)'};
        color: ${isCorrect ? '#00e676' : 'rgba(255,255,255,0.5)'};
      "><strong>${letters[i]}.</strong> ${a}</span>`;
    }).join("");

    const li = document.createElement("li");
    li.style.flexDirection = "column";
    li.style.alignItems = "flex-start";
    li.innerHTML = `
      <div style="display:flex; justify-content:space-between; width:100%; align-items:center;">
        <span><strong>Q${index+1}</strong>${q.question}</span>
        <button onclick="deleteQuestion(${index})">❌ Supprimer</button>
      </div>
      <div style="margin-top: 8px;">${answersHTML}</div>
    `;
    list.appendChild(li);
  });
}

function deleteQuestion(index) {
  if (!confirm("Voulez-vous vraiment supprimer cette question ?")) return;
  let questions = JSON.parse(localStorage.getItem("quizQuestions")) || [];
  questions.splice(index, 1);
  localStorage.setItem("quizQuestions", JSON.stringify(questions));
  renderQuestions();
}

renderQuestions();
</script>

</body>
</html>
